---
- name: Preliminary tasks
  when: post_conf_job is not defined
  ansible.builtin.include_tasks: ./preliminary.yml

- name: Render apps using optimized custom module
  vars:
    # Module deps live in the project venv, so use the playbook interpreter.
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  render_apps:
    dsc: "{{ dsc }}"
    envs: "{{ envs }}"
    role_path: "{{ role_path }}"
    gitops_local_repo: "{{ gitops_local_repo }}"
    context: "{{ hostvars[inventory_hostname] }}" # full list of Ansible variables in context (since `vars` is deprecated)
  register: render_result

- name: Display rendering summary (including errors)
  ansible.builtin.debug:
    msg: "{{ render_result.msg }}"
  when: render_result.msg is defined

- name: Fail if there were errors
  ansible.builtin.fail:
    msg: "Rendering completed with errors. Check the debug output above."
  when: render_result.has_errors | default(False)
